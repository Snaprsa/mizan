version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: muqayyim
      POSTGRES_USER: muqayyim
      POSTGRES_PASSWORD: muqayyim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muqayyim"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./api:/app/api
      - ./schemas:/app/schemas
      - ./extractors:/app/extractors
      - ./providers:/app/providers
      - ./valuation_engine:/app/valuation_engine
      - ./reporting:/app/reporting
      - ./workers:/app/workers
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "cd /app && alembic -c api/alembic.ini upgrade head &&
             uvicorn api.app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    env_file: .env
    volumes:
      - ./api:/app/api
      - ./schemas:/app/schemas
      - ./extractors:/app/extractors
      - ./providers:/app/providers
      - ./valuation_engine:/app/valuation_engine
      - ./reporting:/app/reporting
      - ./workers:/app/workers
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A workers.celery_app worker --loglevel=info --concurrency=2

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - api

volumes:
  pgdata:
