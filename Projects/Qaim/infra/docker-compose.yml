version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qaim
      POSTGRES_PASSWORD: qaim_dev
      POSTGRES_DB: qaim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaim"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://qaim:qaim_dev@db:5432/qaim"
      DATABASE_URL_SYNC: "postgresql://qaim:qaim_dev@db:5432/qaim"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      UPLOAD_DIR: "/app/uploads"
      EXPORT_DIR: "/app/exports"
      SECRET_KEY: "qaim-dev-secret-change-in-prod"
    volumes:
      - ../api:/app/api
      - ../schemas:/app/schemas
      - ../extractors:/app/extractors
      - ../workers:/app/workers
      - ../providers:/app/providers
      - ../reporting:/app/reporting
      - uploads:/app/uploads
      - exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
    volumes:
      - ../frontend/src:/app/src
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  exports:
