name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ENV: development
      DATABASE_URL: sqlite+aiosqlite://
      DATABASE_URL_SYNC: sqlite://
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Projects/Muqayyim-Downloads/requirements-local.txt
      - run: python scripts/check_public_tree.py
      - run: python -m pip install -r Projects/Muqayyim-Downloads/requirements-local.txt
      - run: python -m pytest Projects/Muqayyim-Downloads/api/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Projects/Muqayyim-Downloads/frontend/package-lock.json
      - run: npm ci
        working-directory: Projects/Muqayyim-Downloads/frontend
      - run: npm run test:valuation
        working-directory: Projects/Muqayyim-Downloads/frontend
      - run: npm run build
        working-directory: Projects/Muqayyim-Downloads/frontend
